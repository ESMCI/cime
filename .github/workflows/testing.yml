name: cime testing

on:
  push:
    branches:
      - master
    paths:
      - 'CIME/**'
      - 'scripts/**'
      - 'tools/**'
      - 'utils/**'
      - 'docker/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/testing.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'test-requirements.txt'

  pull_request:
    branches:
      - master
    paths:
      - 'CIME/**'
      - 'scripts/**'
      - 'tools/**'
      - 'utils/**'
      - 'docker/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/testing.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'test-requirements.txt'

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  # Build container image for PRs (local only, saved as artifact)
  build-pr-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          load: true
          tags: cime:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image as artifact
        run: |
          docker save cime:pr-${{ github.event.pull_request.number }} | gzip > /tmp/cime-image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cime-docker-image
          path: /tmp/cime-image.tar.gz
          retention-days: 1

  # Publish container image only on pushes to master
  publish-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          push: true
          tags: ghcr.io/esmci/cime:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pre-commit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && ! cancelled() }}
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Runs pre-commit
        run: |
          pip install pre-commit
          pre-commit run -a

  # Runs unit testing under different python versions.
  unit-testing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && needs.build-pr-image.result == 'success' && ! cancelled() }}
    needs: build-pr-image
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13", "3.14"]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cime-docker-image
          path: /tmp
      - name: Load Docker image
        run: |
          gunzip -c /tmp/cime-image.tar.gz | docker load
      - name: Checkout model code
        uses: actions/checkout@v4
        with:
          repository: ESCOMP/CESM
          path: cesm
          ref: cesm3.0-alphabranch
      - name: Get ccs_config dependency
        working-directory: cesm
        run: |
          # Need these for machine files
          ./bin/git-fleximod update ccs_config

          # Remove CIME to checkout
          rm -rf cime/

          git status
          git submodule status
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: cesm/cime
          submodules: "true"
      - name: Run tests
        run: |
          docker run --rm \
            --entrypoint bash \
            -v ${{ github.workspace }}/cesm:/root/cesm \
            -w /root/cesm/cime \
            -e CIME_MODEL=cesm \
            -e CIME_DRIVER=nuopc \
            -e CIME_TEST_PLATFORM=ubuntu-latest \
            -e SKIP_ENTRYPOINT=true \
            cime:pr-${{ github.event.pull_request.number }} \
            -c "
              set -euxo pipefail
              source /entrypoint.sh
              uv python install ${{ matrix.python-version }}
              uv venv
              source .venv/bin/activate
              uv pip install -r test-requirements.txt
              time uv run python -u -m pytest -vvv -ra -s --cov=CIME --cov-branch --cov-report=xml --machine docker CIME/tests/test_unit*
            "
      - name: Upload coverage reports to Codecov
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Run system tests
  system-testing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && needs.build-pr-image.result == 'success' && ! cancelled() }}
    needs: build-pr-image
    permissions:
      contents: read
      packages: read
    strategy:
      # allow all jobs to finish
      fail-fast: false
      matrix:
        model:
          - name: "e3sm"
            repo: E3SM-Project/e3sm
            branch: master
          - name: "cesm"
            repo: ESCOMP/CESM
            branch: cesm3.0-alphabranch
        driver: ["mct", "nuopc"]
        exclude:
          # exclude nuopc driver when running e3sm tests
          - model: { name: "e3sm" }
            driver: "nuopc"
          # exclude mct driver when running cesm tests
          - model: { name: "cesm" }
            driver: "mct"
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cime-docker-image
          path: /tmp
      - name: Load Docker image
        run: |
          gunzip -c /tmp/cime-image.tar.gz | docker load
      - name: Checkout model code
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.model.repo }}
          path: ${{ matrix.model.name }}
          ref: ${{ matrix.model.branch }}
      - name: Check out model dependencies
        shell: bash
        working-directory: ${{ matrix.model.name }}
        run: |
          # need https for submodules
          sed -i"" "s/\(.*\)url = git@github.com:\(.*\)/\1url = https:\/\/github.com\/\2/g" .gitmodules

          if [[ "${{ matrix.model.name }}" == "e3sm" ]]; then
            git submodule update --init
          else
            # --optional: CMEPS' config_component.xml unconditionally lists
            # FTorch in CASE_SUPPORT_LIBRARIES regardless of the separate
            # USE_FTORCH toggle (default FALSE), but CESM's .gitmodules marks
            # it fxrequired = ToplevelOptional, so a plain `update` never
            # checks it out -- causing "Build script .../FTorch/buildlib
            # ... not found". Upstream CMEPS bug; --optional works around it
            # here without needing a CMEPS-side fix.
            ./bin/git-fleximod update --optional

            # git-fleximod's recursion into a submodule's own .gitmodules
            # (e.g. components/cdeps's "fox"/"genf90", both fxrequired =
            # AlwaysRequired there) doesn't reliably check out those
            # grandchild submodules, causing CMake configure failures like
            # "Cannot find source file: .../fox/fsys/fox_m_fsys_parse_input.F90".
            # A plain recursive update as a follow-up fills that gap for
            # components/cdeps specifically -- scoped to that path (not the
            # whole tree): other components have their own broken/vestigial
            # nested submodules (e.g. components/cism/libraries/mct has no
            # url in .gitmodules) that abort an unscoped recursive update
            # entirely. Rewrite git@ URLs to https first since nested
            # .gitmodules may use SSH too.
            sed -i"" "s/\(.*\)url = git@github.com:\(.*\)/\1url = https:\/\/github.com\/\2/g" components/cdeps/.gitmodules
            git -C components/cdeps submodule foreach --recursive \
              "sed -i'' 's/\(.*\)url = git@github.com:\(.*\)/\1url = https:\/\/github.com\/\2/g' .gitmodules 2>/dev/null || true"
            git submodule update --init --recursive -- components/cdeps
          fi

          # remove cime so it can be checkedout
          rm -rf cime/

          git status
          git submodule status
      - name: Checkout CIME
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: ${{ matrix.model.name }}/cime
          submodules: 'true'
      - name: Create storage directory
        run: mkdir -p ${{ github.workspace }}/storage/inputdata
      - name: Login to GHCR
        # Needed to pull ghcr.io/esmci/cime-inputdata if it's private.
        # Prefer making that package public instead (it's just public grid
        # data, nothing sensitive) so this step -- and packages: read above
        # -- become unnecessary; kept as a fallback either way.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract input data image, if published
        # portal.nersc.gov is unreachable from GH Actions runners (see
        # docker/README.md), so real input data (cime_developer, gen_domain)
        # is instead bundled into docker/Dockerfile.data, built and pushed
        # locally/manually from a network that can reach the data servers
        # (see docker/generate_inputdata.sh and docker/push_inputdata.sh).
        # If that image hasn't been published (yet), "Run tests" below
        # still attempts a best-effort, non-fatal live download as a
        # fallback.
        run: |
          version="$(cat ${{ matrix.model.name }}/cime/docker/INPUTDATA_VERSION)"
          image="ghcr.io/esmci/cime-inputdata:v${version}"
          if docker pull "$image"; then
            cid=$(docker create "$image" /nonexistent)
            docker cp "${cid}":/inputdata/. ${{ github.workspace }}/storage/inputdata/
            docker rm "${cid}"
          else
            echo "::warning::${image} not available; falling back to live download in Run tests"
          fi
      - name: Extract cprnc from image
        # "Run tests" bind-mounts storage/ over /root/storage, shadowing the
        # image's baked-in /root/storage/tools/cprnc (CCSM_CPRNC). Without
        # this, baseline comparisons fail with "Could not interpret CPRNC
        # output" since the binary is missing at runtime.
        run: |
          mkdir -p ${{ github.workspace }}/storage/tools
          cid=$(docker create cime:pr-${{ github.event.pull_request.number }})
          docker cp "${cid}":/root/storage/tools/cprnc ${{ github.workspace }}/storage/tools/cprnc
          docker rm "${cid}"
      - name: Run tests
        run: |
          docker run --rm \
            --entrypoint bash \
            --hostname docker \
            --shm-size=1g \
            -v ${{ github.workspace }}/${{ matrix.model.name }}:/root/model \
            -v ${{ github.workspace }}/storage:/root/storage \
            -w /root/model/cime \
            -e CIME_MODEL=${{ matrix.model.name }} \
            -e CIME_DRIVER=${{ matrix.driver }} \
            -e CIME_TEST_PLATFORM=ubuntu-latest \
            -e SKIP_ENTRYPOINT=true \
            cime:pr-${{ github.event.pull_request.number }} \
            -c "
              set -euxo pipefail
              source /entrypoint.sh
              # Non-fatal: portal.nersc.gov is unreachable from GH Actions
              # runners. Only test_gen_domain needs this data; don't fail
              # the whole job over it.
              DOWNLOAD_SKIP_ON_ERROR=1 download_input_data
              # Log sizes for diagnosability without pulling artifacts.
              ls -la /root/storage/inputdata/cpl/gridmaps/oQU240/ /root/storage/inputdata/share/domains/ || true
              uv python install 3.10
              uv venv
              source .venv/bin/activate
              uv pip install -r test-requirements.txt
              git config --global user.name '${{ github.actor }}'
              git config --global user.email '${{ github.actor }}@users.noreply.github.com'
              time uv run python -u -m pytest -vvv -ra -s --cov=CIME --cov-branch --cov-report=xml --machine docker --no-fortran-run --no-teardown CIME/tests/test_sys*
            "
      - name: Upload coverage reports to Codecov
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      # Optional debugging step. Re-enable intentionally when interactive SSH
      # access to a failed system-testing job is needed.
      # - uses: mxschmitt/action-tmate@v3
      #   if: ${{ failure() && !cancelled() }}
      #   with:
      #     limit-access-to-actor: true
      - name: Create testing log archive
        if: ${{ failure() }}
        shell: bash
        run: |
          tar -czvf ${{ github.workspace }}/testing-logs-${{ github.run_number }}-${{ matrix.model.name }}-${{ matrix.driver }}.tar.gz \
            --ignore-failed-read \
            ${{ github.workspace }}/storage/cases \
            ${{ github.workspace }}/storage/baselines \
            ${{ github.workspace }}/storage/archive \
            2>/dev/null || true
      - name: Upload testing logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: testing-logs-${{ github.run_number }}-${{ matrix.model.name }}-${{ matrix.driver }}
          path: ${{ github.workspace }}/testing-logs-${{ github.run_number }}-${{ matrix.model.name }}-${{ matrix.driver }}.tar.gz
          retention-days: 4
