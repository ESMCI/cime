name: cime testing

on:
  push:
    branches:
      - master
    paths:
      - 'CIME/**'
      - 'scripts/**'
      - 'tools/**'
      - 'utils/**'
      - 'docker/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/testing.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'test-requirements.txt'

  pull_request:
    branches:
      - master
    paths:
      - 'CIME/**'
      - 'scripts/**'
      - 'tools/**'
      - 'utils/**'
      - 'docker/**'
      - '.dockerignore'
      - '.gitignore'
      - '.github/workflows/testing.yml'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'test-requirements.txt'

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  # Build container image for PRs (local only, saved as artifact)
  build-pr-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          load: true
          tags: cime:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image as artifact
        run: |
          docker save cime:pr-${{ github.event.pull_request.number }} | gzip > /tmp/cime-image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cime-docker-image
          path: /tmp/cime-image.tar.gz
          retention-days: 1

  # Publish container image only on pushes to master
  publish-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile
          context: .
          push: true
          tags: ghcr.io/esmci/cime:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pre-commit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && ! cancelled() }}
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Runs pre-commit
        run: |
          pip install pre-commit
          pre-commit run -a

  # Runs unit testing under different python versions.
  unit-testing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && always() && ! cancelled() }}
    needs: build-pr-image
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.13", "3.14"]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cime-docker-image
          path: /tmp
      - name: Load Docker image
        run: |
          docker load < /tmp/cime-image.tar.gz
      - name: Checkout model code
        uses: actions/checkout@v4
        with:
          repository: ESCOMP/CESM
          path: cesm
          ref: cesm3.0-alphabranch
      - name: Get ccs_config dependency
        working-directory: cesm
        run: |
          # Need these for machine files
          ./bin/git-fleximod update ccs_config

          # Remove CIME to checkout
          rm -rf cime/

          git status
          git submodule status
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: cesm/cime
          submodules: "true"
      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/cesm:/root/cesm \
            -w /root/cesm/cime \
            -e CIME_MODEL=cesm \
            -e CIME_DRIVER=nuopc \
            -e CIME_TEST_PLATFORM=ubuntu-latest \
            -e SKIP_ENTRYPOINT=true \
            cime:pr-${{ github.event.pull_request.number }} \
            bash -c "
              source /entrypoint.sh
              uv python install ${{ matrix.python-version }}
              uv venv
              source .venv/bin/activate
              uv pip install -r test-requirements.txt
              uv run pytest -vvv --cov=CIME --cov-branch --cov-report=xml --machine docker CIME/tests/test_unit*
            "
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Run system tests
  system-testing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && always() && ! cancelled() }}
    needs: build-pr-image
    strategy:
      # allow all jobs to finish
      fail-fast: false
      matrix:
        model:
          - name: "e3sm"
            repo: E3SM-Project/e3sm
            branch: master
          - name: "cesm"
            repo: ESCOMP/CESM
            branch: cesm3.0-alphabranch
        driver: ["mct", "nuopc"]
        exclude:
          # exclude nuopc driver when running e3sm tests
          - model: { name: "e3sm" }
            driver: "nuopc"
          # exclude mct driver when running cesm tests
          - model: { name: "cesm" }
            driver: "mct"
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cime-docker-image
          path: /tmp
      - name: Load Docker image
        run: |
          docker load < /tmp/cime-image.tar.gz
      - name: Checkout model code
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.model.repo }}
          path: ${{ matrix.model.name }}
          ref: ${{ matrix.model.branch }}
      - name: Check out model dependencies
        shell: bash
        working-directory: ${{ matrix.model.name }}
        run: |
          # need https for submodules
          sed -i"" "s/\(.*\)url = git@github.com:\(.*\)/\1url = https:\/\/github.com\/\2/g" .gitmodules

          if [[ "${{ matrix.model.name }}" == "e3sm" ]]; then
            git submodule update --init
          else
            ./bin/git-fleximod update
          fi

          # remove cime so it can be checkedout
          rm -rf cime/

          git status
          git submodule status
      - name: Checkout CIME
        uses: actions/checkout@v4
        with:
          path: ${{ matrix.model.name }}/cime
          submodules: 'true'
      - name: Create storage directory
        run: mkdir -p ${{ github.workspace }}/storage/inputdata
      - name: Cache inputdata
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/storage/inputdata
          key: inputdata-2
      - name: Run tests
        run: |
          docker run --rm \
            --hostname docker \
            --shm-size=1g \
            -v ${{ github.workspace }}/${{ matrix.model.name }}:/root/model \
            -v ${{ github.workspace }}/storage:/root/storage \
            -w /root/model/cime \
            -e CIME_MODEL=${{ matrix.model.name }} \
            -e CIME_DRIVER=${{ matrix.driver }} \
            -e CIME_TEST_PLATFORM=ubuntu-latest \
            -e SKIP_ENTRYPOINT=true \
            cime:pr-${{ github.event.pull_request.number }} \
            bash -c "
              source /entrypoint.sh
              uv python install 3.10
              uv venv
              source .venv/bin/activate
              uv pip install -r test-requirements.txt
              git config --global user.name '${{ github.actor }}'
              git config --global user.email '${{ github.actor }}@users.noreply.github.com'
              uv run pytest -vvv --cov=CIME --cov-branch --cov-report=xml --machine docker --pesfile /root/.cime/config_pes.xml --no-fortran-run --no-teardown CIME/tests/test_sys*
            "
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: mxschmitt/action-tmate@v3
        if: ${{ !always() }}
        with:
          limit-access-to-actor: true
      - name: Create testing log archive
        if: ${{ failure() }}
        shell: bash
        run: tar -czvf ${{ github.workspace }}/testing-logs-${{ github.run_number }}-${{ matrix.model.name }}-${{ matrix.driver }}.tar.gz ${{ github.workspace }}/storage/cases ${{ github.workspace }}/storage/baselines ${{ github.workspace }}/storage/archive
      - name: Upload testing logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: testing-logs-${{ github.run_number }}-${{ matrix.model.name }}-${{ matrix.driver }}
          path: ${{ github.workspace }}/testing-logs-${{ github.run_number }}-${{ matrix.model.name }}-${{ matrix.driver }}.tar.gz
          retention-days: 4
